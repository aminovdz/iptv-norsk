<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="50%" stop-color="#0e0e1a"/>
      <stop offset="100%" stop-color="#040408"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="600" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1000" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141424" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0c0c16" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" result="blur" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="220" fill="#8b5cf6" fill-opacity="0.25" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="240" fill="#06b6d4" fill-opacity="0.2" filter="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="32" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Brand Logo & Badge -->
  <g transform="translate(90, 90)">
    <rect width="64" height="64" rx="18" fill="url(#brandGrad)"/>
    <path d="M24 20L44 32L24 44V20Z" fill="#0e0e17"/>
    <text x="85" y="44" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">
      Norsk<tspan fill="#06b6d4">IPTV</tspan>
    </text>
    <rect x="295" y="16" width="65" height="30" rx="8" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.4"/>
    <text x="312" y="36" fill="#c084fc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800">4K</text>
  </g>

  <!-- Main Heading -->
  <g transform="translate(90, 240)">
    <text fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      IPTV Norge — Norges Mest
    </text>
    <text y="70" fill="url(#brandGrad)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      Stabile IPTV Tjeneste (2026)
    </text>
    <text y="130" fill="#9ca3af" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="500">
      Ukomprimert 4K Ultra HD • Anti-Freeze™ 9.0 • 60 FPS Sport • 24/7 Norsk Support
    </text>
  </g>

  <!-- Metric Badges Row -->
  <g transform="translate(90, 470)">
    <!-- Badge 1 -->
    <rect width="210" height="60" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="25" y="36" fill="#10b981" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800">⚡ 99.9% Oppetid</text>

    <!-- Badge 2 -->
    <g transform="translate(230, 0)">
      <rect width="240" height="60" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="25" y="36" fill="#06b6d4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800">🏆 12 Mnd: 600 kr</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(490, 0)">
      <rect width="260" height="60" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="25" y="36" fill="#c084fc" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800">🛡️ 24t Refusjonsgaranti</text>
    </g>
  </g>
</svg>
